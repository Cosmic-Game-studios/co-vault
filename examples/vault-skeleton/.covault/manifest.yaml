# co-vault PROJECT manifest — v0.7
#
# This vault is self-describing. Agents read this file once per session and
# the relevant schema (.covault/schemas/<type>.md) before each write.
#
# The vault is organized around the human memory systems framework
# (Tulving 1972, Squire 2004): each folder maps to a known memory type.
#
# v0.7 enhancements (inspired by DeepResearch):
#   - Structured reasoning protocol (Deep Read) in ORIENT
#   - Change-type classification for proposals (parametric → architectural)
#   - Causal hypothesis + alternatives considered in proposals
#   - Reflection protocol with causal error analysis in reports
#   - Anti-pattern tracking in facts
#   - Per-domain and per-change-type calibration

covault_version: "0.7"
schema_version: 2
scope: project
vault_name: "<set during bootstrap>"

# Authority hierarchy. Higher = more authority.
# Agents may NEVER edit notes at or above `agent+reviewed`.
authority_hierarchy:
  - user             # immutable to agents
  - agent+reviewed   # immutable to agents (promoted from agent after review or 3+ confirmations)
  - agent            # mutable by agents

# Memory systems mapping (Tulving, Squire)
# This connects each vault folder to a category of human memory so the
# agent's storage strategy mirrors how durable memory actually works.
memory_systems:
  procedural:
    description: "How to do things — schemas, conventions, workflows"
    folders: [".covault/schemas"]
    consolidation: immediate
  semantic:
    description: "What is true — atemporal facts, decisions, ground rules"
    folders: ["facts", "decisions", "domains"]
    consolidation: deliberate
  episodic:
    description: "What happened when — time-stamped events tied to specific tasks"
    folders: ["proposals", "reports", "conflicts"]
    consolidation: rapid
  working:
    description: "Current session context — never written to disk"
    folders: []

# Change types — classify every proposal (inspired by DeepResearch mutation types)
# Risk level determines confirmation behavior alongside estimated_effort.
change_types:
  parametric:
    level: 1
    risk: low
    description: "Change a value, config, or threshold"
  structural_addition:
    level: 2
    risk: medium
    description: "Add new function, module, endpoint"
  structural_removal:
    level: 2
    risk: medium
    description: "Remove dead code or unnecessary complexity"
  structural_replacement:
    level: 2
    risk: high
    description: "Replace one implementation with a better one"
  integration:
    level: 2
    risk: medium
    description: "Connect two existing components"
  architectural:
    level: 3
    risk: high
    description: "Design and build a new component from scratch"

# Reasoning protocol — mandatory steps before action (DeepResearch R1-R3)
reasoning_protocol:
  deep_read:
    phase: ORIENT
    steps:
      - problem_decomposition
      - constraint_inventory
      - causal_hypothesis
      - approach_candidates
  hypothesis:
    phase: HYPOTHESIZE
    required_sections:
      - what              # root cause / core mechanism
      - why_i_believe     # evidence from ORIENT
      - falsification     # what would prove this wrong
  reflection:
    phase: VERIFY
    required_sections:
      - surprises
      - causal_error_analysis
      - model_update
      - anti_pattern_candidates

# Fact subtypes — distinguish observations from anti-patterns
fact_types:
  observation:
    description: "Something that IS true about the system"
    default: true
  anti-pattern:
    description: "An approach that was tried and failed — loaded in ORIENT to prevent repetition"
    loaded_in: ORIENT

# Conventions
conventions:
  timestamp_format: "%Y-%m-%dT%H:%MZ"
  filename_format: "<YYYY-MM-DD-HHMM>-<slug>.md"
  slug_rules: "2-4 words, lowercase, hyphenated"
  collision_rule: "append -2, -3, ... until unique"
  one_claim_per_fact: true
  link_format: "[[wikilink]]"
  never_duplicate_text: true
  commit_after_every_phase_write: true

# Folders — each maps to a note type with its own schema.
folders:
  index.md:
    note_type: index
    description: "Vault entry point. Hand-curated by the user."
    typical_author: user
    memory_system: semantic
    schema: .covault/schemas/index.md

  domains/:
    note_type: domain
    description: "One file per subsystem. Defines scope and ground rules."
    typical_author: user
    memory_system: semantic
    schema: .covault/schemas/domain.md
    example: .covault/examples/domain.md

  decisions/:
    note_type: decision
    description: "Immutable architectural and product choices."
    typical_author: user
    memory_system: semantic
    schema: .covault/schemas/decision.md
    example: .covault/examples/decision.md

  facts/:
    note_type: fact
    description: "Atomic observations made by the agent. One claim per file."
    typical_author: agent
    memory_system: semantic
    schema: .covault/schemas/fact.md
    example: .covault/examples/fact.md
    consolidation_threshold: 3   # confirmed 3+ times → promote to agent+reviewed

  proposals/:
    note_type: proposal
    description: "Hypotheses with explicit predictions, written before action."
    typical_author: agent
    memory_system: episodic
    schema: .covault/schemas/proposal.md
    example: .covault/examples/proposal.md

  reports/:
    note_type: report
    description: "Verification of predictions and narrative of what happened."
    typical_author: agent
    memory_system: episodic
    schema: .covault/schemas/report.md
    example: .covault/examples/report.md

  conflicts/:
    note_type: conflict
    description: "Open contradictions. BLOCKS work in the affected domain."
    typical_author: agent
    memory_system: episodic
    schema: .covault/schemas/conflict.md
    example: .covault/examples/conflict.md
    blocks_loop: true

  calibration_log.md:
    note_type: calibration
    description: "Aggregate calibration statistics. Auto-maintained by maintain-vault.sh."
    typical_author: agent
    memory_system: procedural
    schema: .covault/schemas/calibration.md
    auto_maintained: true

  _archive/:
    note_type: any
    description: "Soft-deleted notes. Never delete; move here with reason."
    typical_author: any

# Loop — the 6 phases the agent must run on every task.
# Each phase maps to a documented function in cognitive science.
loop:
  - phase: 1
    name: ORIENT
    function: "Perception — situate yourself in the existing knowledge state"
    science: "Situated cognition (Hutchins 1995); attention orienting"
    can_block: true
  - phase: 2
    name: HYPOTHESIZE
    function: "Build a generative model with explicit, testable predictions"
    science: "Predictive coding (Friston 2010); active inference"
    can_block: false
  - phase: 3
    name: EXECUTE
    function: "Motor action — touch project code"
    science: "Sensorimotor execution"
    can_block: false
  - phase: 4
    name: VERIFY
    function: "Compare predictions to observed reality (prediction error)"
    science: "Predictive processing; Bayesian updating"
    can_block: false
  - phase: 5
    name: CONSOLIDATE
    function: "Write to memory; update calibration; promote stable facts"
    science: "Complementary Learning Systems (McClelland 1995); spaced repetition"
    can_block: false
  - phase: 6
    name: REVIEW
    function: "Resolve conflicts between observation and ground truth"
    science: "Executive function; cognitive control"
    can_block: true
    only_if: contradiction_found

# Auto-maintenance — runs after every loop iteration via bin/maintain-vault.sh
maintenance:
  rebuild_index: every_loop
  decay_confidence: every_loop                  # apply Ebbinghaus-like decay
  promote_facts: every_loop                     # 3+ confirmations → agent+reviewed
  archive_expired: every_loop                   # past valid_until → _archive
  update_calibration: every_loop                # recompute Brier-like score
  validate: every_loop                          # exit non-zero on schema breach

# Autonomous mode — for fire-and-forget tasks
autonomous_mode:
  enabled: true
  hard_limits:
    max_subtasks_per_run: 5
    max_tokens_per_run: 30000
    must_run_on_branch: true
    main_branch_forbidden: true
  exit_conditions:
    - any_conflict_found
    - any_out_of_scope_discovery
    - any_user_authored_note_contradiction
    - token_budget_exceeded
    - subtask_limit_reached
